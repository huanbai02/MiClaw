[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "workspace",
    "logs",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
# 保守 baseline：只捕获语法级问题和明显 undefined name，避免本 PR 引发全仓格式化清理。
select = ["E9", "F821", "F822", "F823"]
